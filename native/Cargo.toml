[package]
name = "clips-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
parakeet = ["transcribe-rs/parakeet"]

[dependencies]
napi = { version = "2", features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
xcap = "0.7.1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
base64 = "0.21"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
parking_lot = "0.12"
lazy_static = "1.4"
log = "0.4"
env_logger = "0.10"
mouse_position = "0.1"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
transcribe-rs = { version = "0.2", default-features = false, optional = true }
flate2 = "1.0"
tar = "0.4"
futures-util = "0.3"
dirs = "5.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.25"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
