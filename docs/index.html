<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip Flow — Features</title>
    <meta
      name="description"
      content="Clip Flow features gallery: recording, editing, and export features with videos and explanations."
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><rect fill="#1f2937" x="8" y="10" width="48" height="40" rx="4"/><path fill="#000" d="M10 18h44v30H10z"/><path d="M12 10h40c2.2 0 4 1.8 4 4v4H8v-4c0-2.2 1.8-4 4-4" fill="#374151"/><circle fill="#ef4444" cx="14" cy="14" r="2"/><g stroke="#55fa7b"><circle cx="32" cy="32" r="1"/><circle cx="32" cy="32" r="6" opacity=".7"/></g><path d="m32 32-12.736 5.768a.936.936 0 0 0 .304 1.752l4.984 1.008 1.016 4.992a.936.936 0 0 0 1.752.312l5.768-12.744A.8.8 0 0 0 32 32" fill="#fff" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
          </div>
          <div class="brand-text">
            <div class="brand-title">Clip Flow</div>
          </div>
        </div>

        <div class="header-actions">
          <a
            class="btn"
            href="https://github.com/erkamkavak/screen-recorder"
            target="_blank"
            rel="noreferrer"
            title="Open GitHub repo"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            GitHub
          </a>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="featureGroups" class="feature-groups">
        <!-- populated by JS -->
      </div>
    </main>

    <div class="modal-backdrop" id="backdrop" hidden></div>
    <div class="hover-preview" id="hoverPreview"></div>
    <dialog class="modal" id="modal" aria-label="Feature details">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-kicker" id="modalKicker"></div>
          <h2 class="modal-title" id="modalTitle"></h2>
        </div>
        <button class="icon-btn" id="modalClose" type="button" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-media-section">
          <div class="media" id="modalMedia"></div>
        </div>
        <div class="modal-content-section">
          <p class="modal-desc" id="modalDesc"></p>
          <div class="meta" id="modalMeta"></div>
        </div>
      </div>
    </dialog>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© Clip Flow</span>
        <span class="footer-spacer"></span>
        <a class="footer-link" href="../README.md">README</a>
      </div>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
