<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      pointer-events: none;
    }
    
    .container {
      display: flex;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    
    .note-pill {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      50% {
        box-shadow: 0 8px 40px rgba(99, 102, 241, 0.3), 0 8px 32px rgba(0, 0, 0, 0.4);
      }
    }
    
    .note-text {
      animation: fade-in 0.2s ease-out;
    }
    
    @keyframes fade-in {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
    
    .note-index {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
    }
    
    .note-index .total {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .note-text {
      font-size: 20px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      max-width: 800px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="container" class="container">
    <div class="note-pill">
      <span class="note-index">
        <span id="current">1</span><span class="total">/<span id="total">1</span></span>
      </span>
      <span id="text" class="note-text"></span>
    </div>
  </div>
  
  <script>
    const container = document.getElementById('container');
    const currentEl = document.getElementById('current');
    const totalEl = document.getElementById('total');
    const textEl = document.getElementById('text');
    
    window.electronNotesAPI.onNoteUpdate((data) => {
      if (data.visible && data.text) {
        currentEl.textContent = data.currentIndex + 1;
        totalEl.textContent = data.totalCount;
        textEl.textContent = data.text;
        container.classList.add('visible');
      } else {
        container.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
